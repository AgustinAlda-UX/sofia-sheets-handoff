</head><body>
<div class="sofia-preview-stage" data-group="modal" data-variant="modal-context">
<div class="sofia-modal-overlay">
  <div class="sofia-modal sofia-modal--tabs" role="dialog" aria-modal="true" aria-labelledby="sofia-modal-context-title">
    <div class="sofia-modal__header">
      <h2 class="sofia-modal__title" id="sofia-modal-context-title">Title</h2>
      <button class="sofia-modal__close" type="button" aria-label="Cerrar"><i class="eva-3-icon-cross" aria-hidden="true"></i></button>
    </div>
    <div class="eva-3-tabs -no-stroke sofia-modal__tabs">
      <div class="tabs-nav-corners-container">
        <div class="tabs-nav-container">
          <ul class="tabs-nav" role="tablist">
            <li class="tabs-nav-item -active" role="tab" aria-selected="true" tabindex="0">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
          </ul>
        </div>
      </div>
    </div>
    <div class="sofia-modal__body" role="tabpanel">
      <div class="sofia-modal__slot"><!-- [Put content here] --></div>
    </div>
    <div class="sofia-modal__footer">
      <button class="eva-3-btn-ghost -md -primary" type="button"><em class="btn-text">Secondary button</em></button>
      <button class="eva-3-btn -md -primary sofia-modal__primary" type="button"><em class="btn-text">Primary button</em></button>
    </div>
  </div>
</div>

</div>

</body></html>
