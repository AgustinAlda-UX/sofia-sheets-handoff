<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialogue · Desktop · Simple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://www.despegar.com/eva-core/static/eva/eva-core.min.css?">
<link rel="stylesheet" href="https://www.despegar.com/eva-core/static/eva/eva.min.css?">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components/bs-chat.css">
<link rel="stylesheet" href="../css/components/bs-dialogue.css">
<link rel="stylesheet" href="../css/components/bs-footer.css">
<link rel="stylesheet" href="../css/components/bs-header.css">
<link rel="stylesheet" href="../css/components/bs-hero.css">
<link rel="stylesheet" href="../css/components/bs-sheets.css">
<link rel="stylesheet" href="../css/components/forms-coupon.css">
<link rel="stylesheet" href="../css/components/forms-trip.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/side-sheet.css">
<style>html,body{margin:0;padding:0;background:#d8d8d8;}
.sofia-preview-stage{position:relative;width:575px;height:356px;overflow:hidden;}</style>
</head><body>
<div class="sofia-preview-stage" data-group="bs-dialogue" data-variant="desktop-simple">
<div class="sofia-dialogue sofia-dialogue--desktop">
  <!-- BS_header · Type=desktop-compact -->
  <header class="sofia-bs-header sofia-bs-header--desktop-compact">
    <div class="sofia-bs-header__handle sofia-bs-header__handle--desktop" aria-hidden="true"><span class="sofia-bs-header__handle-bar"></span></div>
    <div class="sofia-bs-header__row">
      <div class="sofia-bs-header__bar">
        <h2 class="sofia-bs-header__title sofia-bs-header__title--s">Title</h2>
        <button type="button" class="sofia-bs-header__close-sm" aria-label="Cerrar">
          <img src="../assets/icons/sofia-ic-close-sm.svg" width="16" height="16" alt="">
        </button>
      </div>
    </div>
  </header>
  <!-- Content · BS / Slot -->
  <div class="sofia-dialogue__content">
    <div class="sofia-slot"><p class="sofia-slot__label">BS / Slot</p></div>
  </div>
  <!-- Action Container · Footer=Dual CTA -->
  <footer class="sofia-bs-footer sofia-bs-footer--dual">
    <div class="sofia-bs-footer__actions">
      <button type="button" class="eva-3-btn-ghost -md -primary"><em class="btn-text">Secondary</em></button>
      <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Primary</em></button>
    </div>
  </footer>
</div>

</div>

</body></html>
