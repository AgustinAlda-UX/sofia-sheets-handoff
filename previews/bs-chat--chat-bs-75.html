<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHAT · bottom sheet 75%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://www.despegar.com/eva-core/static/eva/eva-core.min.css?">
<link rel="stylesheet" href="https://www.despegar.com/eva-core/static/eva/eva.min.css?">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components/bs-chat.css">
<link rel="stylesheet" href="../css/components/bs-footer.css">
<link rel="stylesheet" href="../css/components/bs-header.css">
<link rel="stylesheet" href="../css/components/bs-hero.css">
<link rel="stylesheet" href="../css/components/bs-sheets.css">
<link rel="stylesheet" href="../css/components/forms-coupon.css">
<link rel="stylesheet" href="../css/components/forms-trip.css">
<link rel="stylesheet" href="../css/components/modal.css">
<link rel="stylesheet" href="../css/components/side-sheet.css">
<style>html,body{margin:0;padding:0;background:#ffffff;}
.sofia-preview-stage{position:relative;width:360px;height:753px;overflow:hidden;}</style>
</head><body>
<div class="sofia-preview-stage" data-group="bs-chat" data-variant="chat-bs-75">
<div class="sofia-chat">
  <header class="sofia-chat__header">
    <div class="sofia-chat__status-bar" aria-hidden="true">
      <p class="sofia-chat__time">10:00</p>
      <div class="sofia-chat__status-icons">
        <img src="../assets/icons/chat-status-signal.svg" width="14" height="14" alt="">
        <span class="sofia-chat__status-group">
          <img src="../assets/icons/chat-status-wifi.svg" width="14" height="14" alt="">
          <img src="../assets/icons/chat-status-battery.svg" width="14" height="14" alt="">
        </span>
      </div>
    </div>
    <div class="sofia-chat__app-bar">
      <div class="sofia-chat__app-bar-start">
        <button type="button" class="sofia-chat__icon-btn" aria-label="Volver"><i class="eva-3-icon-arrow-bold-left" aria-hidden="true"></i></button>
      </div>
      <button type="button" class="sofia-chat__icon-btn" aria-label="Ver carrito"><i class="eva-3-icon-trolley" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="sofia-chat__body">
    <div class="sofia-chat__dialog">
      <div class="sofia-chat__dialog-message">
        <div class="sofia-chat__bubble">
          <p class="sofia-chat__bubble-text">Quiero ver vuelos a Madrid</p>
        </div>
        <span class="sofia-chat__bubble-tail" aria-hidden="true"><span class="sofia-chat__bubble-tail-box"><span class="sofia-chat__bubble-tail-shape"><img src="../assets/img/chat-dialog-tail.svg" width="10.3923" height="8.25" alt=""></span></span></span>
      </div>
      <div class="sofia-chat__avatar">
        <div class="eva-3-avatar -image -md">
          <img class="avatar-image" src="../assets/img/chat-user-avatar.png" alt="Avatar del usuario">
        </div>
      </div>
    </div>
  </div>
  <div class="sofia-chat__input">
    <div class="sofia-chat__input-row">
      <button type="button" class="sofia-chat__menu" aria-label="Abrir menú"><i class="eva-3-icon-list" aria-hidden="true"></i></button>
      <div class="sofia-chat__field-wrap">
        <input type="text" class="sofia-chat__field" placeholder="Escribe tu consulta..." aria-label="Escribe tu consulta">
        <button type="button" class="eva-3-btn -md -link -circle sofia-chat__mic" aria-label="Dictar por voz"><i class="eva-3-icon-microphone btn-icon" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="sofia-chat__terms">
      <p class="sofia-chat__terms-text">Las respuestas del chat son generadas automáticamente y pueden contener errores. Antes de utilizarlo, lee los <a class="sofia-chat__terms-link" href="#">términos y condiciones.</a></p>
    </div>
  </div>
  <!-- Sheet 75% -->
  <div class="sofia-chat__sheet sofia-chat__sheet--75">
    <div class="sofia-overlay" aria-hidden="true"></div>
    <section class="sofia-chat__panel" role="dialog" aria-modal="true" aria-labelledby="sofia-chat-bs-75-title">
      <header class="sofia-bs-header sofia-bs-header--title">
        <div class="sofia-bs-header__handle" aria-hidden="true"><span class="sofia-bs-header__handle-bar"></span></div>
        <div class="sofia-bs-header__row">
          <div class="sofia-bs-header__bar">
            <h2 class="sofia-bs-header__title eva-3-h5" id="sofia-chat-bs-75-title">Title</h2>
            <button type="button" class="sofia-bs-header__close" aria-label="Cerrar"><i class="eva-3-icon-close" aria-hidden="true"></i></button>
          </div>
        </div>
      </header>
      <div class="sofia-bs-content">
        <!-- [Put content here]: reemplazar el placeholder por el contenido de la sheet -->
        <div class="sofia-chat__placeholder"></div>
      </div>
      <footer class="sofia-bs-footer sofia-bs-footer--single">
        <div class="sofia-bs-footer__actions">
          <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Primary button</em></button>
        </div>
      </footer>
    </section>
  </div>
</div>

</div>

</body></html>
