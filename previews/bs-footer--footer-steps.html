<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://www.despegar.com/eva-core/static/eva/eva-core.min.css?">
<link rel="stylesheet" href="https://www.despegar.com/eva-core/static/eva/eva.min.css?">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components/bs-chat.css">
<link rel="stylesheet" href="../css/components/bs-footer.css">
<link rel="stylesheet" href="../css/components/bs-header.css">
<link rel="stylesheet" href="../css/components/bs-hero.css">
<link rel="stylesheet" href="../css/components/bs-sheets.css">

<style>html,body{margin:0;padding:0;background:#ffffff;}
.sofia-preview-stage{position:relative;width:360px;height:68px;overflow:hidden;}</style>
</head><body>
<div class="sofia-preview-stage" data-group="bs-footer" data-variant="footer-steps">
<footer class="sofia-bs-footer sofia-bs-footer--steps">
  <div class="sofia-bs-footer__actions">
    <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Siguiente</em></button>
    <div class="sofia-bs-footer__steps" role="group" aria-label="Pasos">
      <button type="button" class="sofia-bs-footer__steps-btn" aria-label="Paso anterior"><i class="eva-3-icon-chevron-left" aria-hidden="true"></i></button>
      <span class="sofia-bs-footer__steps-label">1 de 3</span>
      <button type="button" class="sofia-bs-footer__steps-btn" aria-label="Paso siguiente"><i class="eva-3-icon-chevron-right" aria-hidden="true"></i></button>
    </div>
  </div>
</footer>

</div>

</body></html>
