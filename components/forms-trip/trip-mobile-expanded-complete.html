<!-- SOFIA · Widget "Tu viaje" mobile expandido (bottom sheet + scrim) — viaje completo · Figma 4181:29162 -->
<div class="sofia-trip-sheet">
  <div class="sofia-trip-sheet__scrim" aria-hidden="true"></div>
  <section class="sofia-trip-widget sofia-trip-widget--sheet" role="dialog" aria-modal="true" aria-label="Tu viaje">
    <header class="sofia-trip-widget__header">
      <span class="sofia-trip-widget__handle" aria-hidden="true"></span>
      <div class="sofia-trip-widget__heading">
        <div class="sofia-trip-widget__heading-main">
          <p class="sofia-trip-widget__title">Tu viaje</p>
          <div class="sofia-trip-widget__status">
            <i class="eva-3-icon-checkmark-circle-filled is-done" aria-hidden="true"></i>
            <i class="eva-3-icon-checkmark-circle-filled is-done" aria-hidden="true"></i>
            <i class="eva-3-icon-checkmark-circle-filled is-done" aria-hidden="true"></i>
          </div>
        </div>
        <button class="sofia-trip-widget__toggle" type="button" aria-expanded="true" aria-label="Colapsar">
          <i class="eva-3-icon-chevron-down" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div class="sofia-trip-widget__body">
      <div class="sofia-trip-widget__row">
        <div class="sofia-trip-widget__row-main">
          <img class="sofia-trip-widget__thumb" src="../assets/img/trip-destination-rio-de-janeiro.png" alt="">
          <div class="sofia-trip-widget__info">
            <p class="sofia-trip-widget__name">Río de Janeiro, Brasil</p>
            <p class="sofia-trip-widget__meta">Ago 5-12</p>
          </div>
          <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Cambiar">
            <i class="eva-3-icon-refresh btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="sofia-trip-widget__row sofia-trip-widget__row--flight sofia-trip-widget__row--added">
        <div class="sofia-trip-widget__segment">
          <div class="sofia-trip-widget__airline">
            <span class="sofia-trip-widget__airline-logo"><img src="../assets/img/trip-airline-latam.png" alt="Latam"></span>
          </div>
          <div class="sofia-trip-widget__flight">
            <p class="sofia-trip-widget__flight-date">Ago 5 - 2 pasajeros</p>
            <div class="sofia-trip-widget__flight-info">
              <div class="sofia-trip-widget__airports">
                <div class="sofia-trip-widget__airport">
                  <p class="sofia-trip-widget__airport-code">EZE</p>
                  <p class="sofia-trip-widget__airport-time">12:05</p>
                </div>
                <div class="sofia-trip-widget__airport">
                  <p class="sofia-trip-widget__airport-code">GIG</p>
                  <p class="sofia-trip-widget__airport-time">18:15</p>
                </div>
              </div>
              <div class="sofia-trip-widget__flight-summary">
                <p class="sofia-trip-widget__stops">Directo</p>
                <p class="sofia-trip-widget__duration">15 h 10 m</p>
              </div>
            </div>
          </div>
          <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Cambiar">
            <i class="eva-3-icon-refresh btn-icon" aria-hidden="true"></i>
          </button>
        </div>
        <div class="sofia-trip-widget__segment">
          <div class="sofia-trip-widget__airline">
            <span class="sofia-trip-widget__airline-logo"><img src="../assets/img/trip-airline-latam.png" alt="Latam"></span>
          </div>
          <div class="sofia-trip-widget__flight">
            <p class="sofia-trip-widget__flight-date">Ago 12 - 2 pasajeros</p>
            <div class="sofia-trip-widget__flight-info">
              <div class="sofia-trip-widget__airports">
                <div class="sofia-trip-widget__airport">
                  <p class="sofia-trip-widget__airport-code">GIG</p>
                  <p class="sofia-trip-widget__airport-time">12:05</p>
                </div>
                <div class="sofia-trip-widget__airport">
                  <p class="sofia-trip-widget__airport-code">EZE</p>
                  <p class="sofia-trip-widget__airport-time">18:15</p>
                </div>
              </div>
              <div class="sofia-trip-widget__flight-summary">
                <p class="sofia-trip-widget__stops">Directo</p>
                <p class="sofia-trip-widget__duration">15 h 10 m</p>
              </div>
            </div>
          </div>
          <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Cambiar">
            <i class="eva-3-icon-refresh btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="sofia-trip-widget__row">
        <div class="sofia-trip-widget__row-main">
          <img class="sofia-trip-widget__thumb" src="../assets/img/trip-destination-rio-de-janeiro.png" alt="">
          <div class="sofia-trip-widget__info">
            <p class="sofia-trip-widget__name">Río de Janeiro, Brasil</p>
            <p class="sofia-trip-widget__meta">Ago 5-12</p>
          </div>
          <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Cambiar">
            <i class="eva-3-icon-refresh btn-icon" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>

    <footer class="sofia-trip-widget__footer">
      <div class="sofia-trip-widget__price">
        <i class="eva-3-icon-trolley" aria-hidden="true"></i>
        <div class="sofia-trip-widget__price-text">
          <span class="sofia-trip-widget__price-label">Costo de tu viaje</span>
          <span class="sofia-trip-widget__price-value">${9.999.999,99}</span>
        </div>
      </div>
      <button class="eva-3-btn -md -primary" type="button">
        <em class="btn-text">Ir a pagar</em><i class="eva-3-icon-arrow-bold-right btn-icon" aria-hidden="true"></i>
      </button>
    </footer>
  </section>
</div>
