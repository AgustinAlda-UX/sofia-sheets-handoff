<!-- SOFIA · Widget "Tu viaje" desktop expandido — estado inicial (solo destino) · Figma 4181:28046 -->
<section class="sofia-trip-widget sofia-trip-widget--desktop" aria-label="Tu viaje">
  <header class="sofia-trip-widget__header">
    <div class="sofia-trip-widget__heading">
      <div class="sofia-trip-widget__heading-main">
        <p class="sofia-trip-widget__title">Tu viaje</p>
        <div class="sofia-trip-widget__status">
          <i class="eva-3-icon-checkmark-circle-filled is-done" aria-hidden="true"></i>
          <i class="eva-3-icon-airplane-going" aria-hidden="true"></i>
          <i class="eva-3-icon-aparthotel" aria-hidden="true"></i>
        </div>
      </div>
      <button class="sofia-trip-widget__toggle" type="button" aria-expanded="true" aria-label="Colapsar">
        <i class="eva-3-icon-chevron-down" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="sofia-trip-widget__body">
    <div class="sofia-trip-widget__row">
      <div class="sofia-trip-widget__row-main">
        <img class="sofia-trip-widget__thumb" src="../assets/img/trip-destination-rio-de-janeiro.png" alt="">
        <div class="sofia-trip-widget__info">
          <p class="sofia-trip-widget__name">Río de Janeiro, Brasil</p>
          <p class="sofia-trip-widget__meta">Ago 5-12</p>
        </div>
        <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Cambiar">
          <i class="eva-3-icon-refresh btn-icon" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="sofia-trip-widget__row sofia-trip-widget__row--empty">
      <div class="sofia-trip-widget__row-main">
        <i class="eva-3-icon-airplane-going" aria-hidden="true"></i>
        <p class="sofia-trip-widget__empty-label">Elegí vuelos</p>
      </div>
      <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Elegí vuelos">
        <i class="eva-3-icon-arrow-bold-right btn-icon" aria-hidden="true"></i>
      </button>
    </div>

    <div class="sofia-trip-widget__row sofia-trip-widget__row--empty">
      <div class="sofia-trip-widget__row-main">
        <i class="eva-3-icon-hotel-resort-ui" aria-hidden="true"></i>
        <p class="sofia-trip-widget__empty-label">Agregá un alojamiento</p>
      </div>
      <button class="eva-3-btn -md -link -circle sofia-trip-widget__row-action" type="button" aria-label="Agregá un alojamiento">
        <i class="eva-3-icon-arrow-bold-right btn-icon" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <footer class="sofia-trip-widget__footer">
    <div class="sofia-trip-widget__price">
      <i class="eva-3-icon-trolley" aria-hidden="true"></i>
      <div class="sofia-trip-widget__price-text">
        <span class="sofia-trip-widget__price-label">Costo de tu viaje</span>
        <span class="sofia-trip-widget__price-value">${9.999.999,99}</span>
      </div>
    </div>
    <button class="eva-3-btn -md -primary" type="button">
      <em class="btn-text">Continuar</em><i class="eva-3-icon-arrow-bold-right btn-icon" aria-hidden="true"></i>
    </button>
  </footer>
</section>
