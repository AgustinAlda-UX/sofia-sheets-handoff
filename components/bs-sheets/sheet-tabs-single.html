<section class="sofia-bs" role="dialog" aria-modal="true" aria-label="Title">
  <header class="sofia-bs-header sofia-bs-header--tabs">
    <div class="sofia-bs-header__handle" aria-hidden="true"><span class="sofia-bs-header__handle-bar"></span></div>
    <div class="sofia-bs-header__row">
      <div class="sofia-bs-header__bar">
        <h2 class="sofia-bs-header__title eva-3-h5">Title</h2>
        <button type="button" class="sofia-bs-header__close" aria-label="Cerrar"><i class="eva-3-icon-close" aria-hidden="true"></i></button>
      </div>
      <div class="sofia-bs-header__tabs eva-3-tabs -no-stroke">
        <div class="tabs-nav-corners-container">
          <div class="tabs-nav-container">
            <ul class="tabs-nav" role="tablist">
              <li class="tabs-nav-item -subtitle -active" role="tab" aria-selected="true" tabindex="0">
                <span class="tab-label">Titulo</span>
                <span class="tab-label">Bajada</span>
              </li>
              <li class="tabs-nav-item -subtitle" role="tab" aria-selected="false" tabindex="-1">
                <span class="tab-label">Titulo</span>
                <span class="tab-label">Bajada</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="sofia-bs-content sofia-bs__body">
    <!-- BS / Slot: reemplazar el placeholder por el contenido del bottom sheet (scrollea adentro) -->
    <div class="sofia-slot">
      <p class="sofia-slot__label">Content / Slot</p>
    </div>
  </div>
  <footer class="sofia-bs-footer sofia-bs-footer--single">
    <div class="sofia-bs-footer__actions">
      <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Primary button</em></button>
    </div>
  </footer>
</section>
