<section class="sofia-bs" role="dialog" aria-modal="true" aria-label="Titulo">
  <div class="sofia-bs-hero sofia-bs-hero--tags">
    <div class="sofia-bs-hero__media">
      <div class="sofia-bs-hero__photo">
        <img src="../assets/img/bs-hero-house.png" alt="">
      </div>
      <div class="sofia-bs-hero__scrim sofia-bs-hero__scrim--bottom" aria-hidden="true">
        <div class="sofia-bs-hero__scrim-blur"></div>
        <img class="sofia-bs-hero__scrim-fill" src="../assets/img/bs-hero-scrim-bottom.svg" alt="">
      </div>
      <div class="sofia-bs-hero__content">
        <div class="sofia-bs-hero__scrim sofia-bs-hero__scrim--text" aria-hidden="true">
          <div class="sofia-bs-hero__scrim-blur"></div>
          <img class="sofia-bs-hero__scrim-fill" src="../assets/img/bs-hero-scrim-text.svg" alt="">
        </div>
        <div class="sofia-bs-hero__text">
          <p class="sofia-bs-hero__title">Titulo</p>
          <p class="sofia-bs-hero__subtitle">Bajada</p>
        </div>
      </div>
      <span class="sofia-bs-hero__handle" aria-hidden="true"></span>
      <button type="button" class="sofia-bs-hero__close" aria-label="Cerrar">
        <i class="eva-3-icon-close" aria-hidden="true"></i>
      </button>
    </div>
    <div class="sofia-bs-hero__tags">
      <span class="eva-3-tag" role="button" tabindex="0"><span class="tag-text">Tag text</span><i class="tag-icon eva-3-icon-cross" aria-hidden="true"></i></span>
      <span class="eva-3-tag" role="button" tabindex="0"><span class="tag-text">Tag text</span><i class="tag-icon eva-3-icon-cross" aria-hidden="true"></i></span>
      <span class="eva-3-tag" role="button" tabindex="0"><span class="tag-text">Tag text</span><i class="tag-icon eva-3-icon-cross" aria-hidden="true"></i></span>
      <span class="eva-3-tag" role="button" tabindex="0"><span class="tag-text">Tag text</span><i class="tag-icon eva-3-icon-cross" aria-hidden="true"></i></span>
    </div>
  </div>
  <div class="sofia-bs-content sofia-bs__body">
    <!-- BS / Slot: reemplazar el placeholder por el contenido del bottom sheet (scrollea adentro) -->
    <div class="sofia-slot">
      <p class="sofia-slot__label">Content / Slot</p>
    </div>
  </div>
  <footer class="sofia-bs-footer sofia-bs-footer--single">
    <div class="sofia-bs-footer__actions">
      <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Primary button</em></button>
    </div>
  </footer>
</section>
