<div class="sofia-chat">
  <div class="sofia-chat__body">
    <div class="sofia-chat__dialog">
      <div class="sofia-chat__dialog-message">
        <div class="sofia-chat__bubble">
          <p class="sofia-chat__bubble-text">Quiero ver vuelos a Madrid</p>
        </div>
        <span class="sofia-chat__bubble-tail" aria-hidden="true"><span class="sofia-chat__bubble-tail-box"><span class="sofia-chat__bubble-tail-shape"><img src="../assets/img/chat-dialog-tail.svg" width="10.3923" height="8.25" alt=""></span></span></span>
      </div>
      <div class="sofia-chat__avatar">
        <div class="eva-3-avatar -image -md">
          <img class="avatar-image" src="../assets/img/chat-user-avatar.png" alt="Avatar del usuario">
        </div>
      </div>
    </div>
  </div>
  <div class="sofia-chat__input">
    <div class="sofia-chat__input-row">
      <button type="button" class="sofia-chat__menu" aria-label="Abrir menú"><i class="eva-3-icon-list" aria-hidden="true"></i></button>
      <div class="sofia-chat__field-wrap">
        <input type="text" class="sofia-chat__field" placeholder="Escribe tu consulta..." aria-label="Escribe tu consulta">
        <button type="button" class="eva-3-btn -md -link -circle sofia-chat__mic" aria-label="Dictar por voz"><i class="eva-3-icon-microphone btn-icon" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="sofia-chat__terms">
      <p class="sofia-chat__terms-text">Las respuestas del chat son generadas automáticamente y pueden contener errores. Antes de utilizarlo, lee los <a class="sofia-chat__terms-link" href="#">términos y condiciones.</a></p>
    </div>
  </div>
  <!-- Sheet 100% · modal full screen: cubre todo el chat, sin overlay ni handle -->
  <div class="sofia-chat__sheet sofia-chat__sheet--100">
    <section class="sofia-chat__panel" role="dialog" aria-modal="true" aria-labelledby="sofia-chat-bs-100-title">
      <header class="sofia-bs-header sofia-bs-header--title">
        <div class="sofia-bs-header__row">
          <div class="sofia-bs-header__bar">
            <h2 class="sofia-bs-header__title eva-3-h5" id="sofia-chat-bs-100-title">Title</h2>
            <button type="button" class="sofia-bs-header__close" aria-label="Cerrar"><i class="eva-3-icon-close" aria-hidden="true"></i></button>
          </div>
        </div>
      </header>
      <div class="sofia-bs-content">
        <!-- [Put content here]: reemplazar el placeholder por el contenido de la sheet -->
        <div class="sofia-chat__placeholder"></div>
      </div>
      <footer class="sofia-bs-footer sofia-bs-footer--single">
        <div class="sofia-bs-footer__actions">
          <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Primary button</em></button>
        </div>
      </footer>
    </section>
  </div>
</div>
