<div class="sofia-dialogue sofia-dialogue--mobile">
  <!-- BS_header · Type=mobile-compact -->
  <header class="sofia-bs-header sofia-bs-header--mobile-compact">
    <div class="sofia-bs-header__handle" aria-hidden="true"><span class="sofia-bs-header__handle-bar"></span></div>
    <div class="sofia-bs-header__row">
      <div class="sofia-bs-header__bar">
        <h2 class="sofia-bs-header__title eva-3-h5">Title</h2>
        <button type="button" class="sofia-bs-header__close-sm" aria-label="Cerrar">
          <img src="../assets/icons/sofia-ic-close-sm.svg" width="16" height="16" alt="">
        </button>
      </div>
    </div>
  </header>
  <!-- Content · BS / Slot -->
  <div class="sofia-dialogue__content">
    <div class="sofia-slot"><p class="sofia-slot__label">BS / Slot</p></div>
  </div>
  <!-- Action Container · Footer=Paginación -->
  <footer class="sofia-bs-footer sofia-bs-footer--steps">
    <div class="sofia-bs-footer__actions sofia-bs-footer__actions--steps">
      <button type="button" class="sofia-bs-footer__steps-btn" aria-label="Anterior">
        <i class="eva-3-icon-chevron-left" aria-hidden="true"></i>
      </button>
      <span class="sofia-bs-footer__steps-label">1 de 3</span>
      <button type="button" class="sofia-bs-footer__steps-btn" aria-label="Siguiente">
        <i class="eva-3-icon-chevron-right" aria-hidden="true"></i>
      </button>
    </div>
  </footer>
</div>
