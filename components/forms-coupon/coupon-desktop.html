<!-- SOFIA · bottomsheet form · Cupón de descuento (desktop) · Figma 4181:29648 / 4181:29808 -->
<section class="sofia-bs-form sofia-bs-form--coupon" role="dialog" aria-labelledby="sofia-coupon-desktop-title">
  <header class="sofia-bs-form__header">
    <div class="sofia-bs-form__heading">
      <h2 class="sofia-bs-form__title" id="sofia-coupon-desktop-title">Tu cupón de descuento</h2>
      <button type="button" class="sofia-bs-form__close" aria-label="Cerrar">
        <i class="eva-3-icon-close" aria-hidden="true"></i>
      </button>
    </div>
  </header>
  <div class="sofia-bs-form__body sofia-coupon">
    <div class="sofia-coupon__band">
      <div class="sofia-coupon__header">
        <div class="sofia-coupon__art"><img src="../assets/img/coupon-illustration.svg" alt=""></div>
        <div class="sofia-coupon__info">
          <p class="sofia-coupon__code">RIOXSELL56K</p>
          <p class="sofia-coupon__amount">$ 56.000 de descuento</p>
        </div>
      </div>
    </div>
    <div class="sofia-coupon__details">
      <p class="sofia-coupon__text">Copiá el código y pegalo en el checkout al momento de pagar.</p>
      <ul class="sofia-coupon__conditions">
        <li class="sofia-coupon__condition"><i class="eva-3-icon-checkmark-circle" aria-hidden="true"></i>Solo para {alojamientos}</li>
        <li class="sofia-coupon__condition"><i class="eva-3-icon-checkmark-circle" aria-hidden="true"></i>Válido hasta {30 de Junio}</li>
      </ul>
    </div>
  </div>
  <footer class="sofia-bs-form__footer">
    <button type="button" class="eva-3-btn -md -primary">
      <em class="btn-text">Copiar código RIOXSELL56K</em>
      <i class="eva-3-icon-copy btn-icon" aria-hidden="true"></i>
    </button>
  </footer>
</section>
