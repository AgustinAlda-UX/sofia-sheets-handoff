<aside class="sofia-ss sofia-ss--tabs" role="dialog" aria-modal="true" aria-labelledby="sofia-ss-tabs-label">
  <header class="sofia-ss__header sofia-ss-header">
    <h2 class="sofia-ss__title eva-3-h3" id="sofia-ss-tabs-label">Title</h2>
    <button type="button" class="sofia-ss__close" aria-label="Cerrar"><i class="eva-3-icon-close" aria-hidden="true"></i></button>
  </header>
  <div class="sofia-ss__tabs">
    <div class="eva-3-tabs -no-stroke">
      <div class="tabs-nav-corners-container">
        <div class="tabs-nav-container">
          <ul class="tabs-nav" role="tablist">
            <li class="tabs-nav-item -active" role="tab" aria-selected="true" tabindex="0">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
            <li class="tabs-nav-item" role="tab" aria-selected="false" tabindex="-1">Tab label</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="sofia-ss__body sofia-bs-content" role="tabpanel">
    <!-- BS / Slot: reemplazar el placeholder por el contenido del side sheet -->
    <div class="sofia-slot">
      <p class="sofia-slot__label">Content / Slot</p>
    </div>
  </div>
  <footer class="sofia-bs-footer sofia-bs-footer--single">
    <div class="sofia-bs-footer__actions">
      <button type="button" class="eva-3-btn -md -primary"><em class="btn-text">Primary button</em></button>
    </div>
  </footer>
</aside>
